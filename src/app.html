<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		%sveltekit.head%
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link rel="preconnect" href="https://fonts.cdnfonts.com" crossorigin />
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap"
		/>
		<!-- Oddval's own stylesheet ships no font-display, so the browser blocks on it
		     for up to 3s. Declared here instead with swap: Poppins shows immediately
		     and Oddval takes over when it arrives. -->
		<link
			rel="preload"
			as="font"
			type="font/woff"
			href="https://fonts.cdnfonts.com/s/113297/Oddval-SemiBold.woff"
			crossorigin
		/>
		<style>
			@font-face {
				font-family: 'Oddval';
				font-style: normal;
				font-weight: 600;
				font-display: swap;
				src:
					local('Oddval'),
					url('https://fonts.cdnfonts.com/s/113297/Oddval-SemiBold.woff') format('woff');
			}
		</style>
	</head>
	<body data-sveltekit-preload-data="tap">
		<div>%sveltekit.body%</div>
	</body>
</html>
