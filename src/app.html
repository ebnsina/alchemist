<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<link rel="preload" href="/fonts/google-sans-flex-latin.woff2" as="font" type="font/woff2" crossorigin />
		<script>
			// The whole client runtime. Pre-paint so a remembered choice never flashes,
			// then two delegated listeners. No IP or navigator.language guessing: the
			// toggle is the only thing that decides the language.
			(function () {
				var d = document.documentElement;
				function get(k) {
					try {
						return localStorage.getItem(k);
					} catch (e) {
						return null;
					}
				}
				function put(k, v) {
					try {
						localStorage.setItem(k, v);
					} catch (e) {}
				}
				var lang = get('alc-lang');
				if (lang === 'bn' || lang === 'en') d.lang = lang;
				var theme = get('alc-theme');
				if (theme === 'light' || theme === 'dark') d.dataset.theme = theme;

				function paintLang() {
					var b = document.querySelectorAll('[data-set-lang]');
					for (var i = 0; i < b.length; i++)
						b[i].setAttribute('aria-pressed', b[i].dataset.setLang === d.lang ? 'true' : 'false');
				}
				document.addEventListener('DOMContentLoaded', paintLang);
				document.addEventListener('click', function (e) {
					var l = e.target.closest && e.target.closest('[data-set-lang]');
					if (l) {
						d.lang = l.dataset.setLang;
						put('alc-lang', d.lang);
						paintLang();
						return;
					}
					if (e.target.closest && e.target.closest('[data-toggle-theme]')) {
						// Dark is the default, so anything that is not explicitly light is dark.
						d.dataset.theme = d.dataset.theme === 'light' ? 'dark' : 'light';
						put('alc-theme', d.dataset.theme);
					}
				});
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="tap">
		<div>%sveltekit.body%</div>
	</body>
</html>
