openapi: 3.1.0
info:
  title: Alchemist API
  version: "1.0"
  description: |
    Video transcoding and delivery.

    Authenticate control-plane calls with `Authorization: Bearer <api-key>`.
    Playback URLs carry their own short-lived signature instead and need no key,
    because the caller is a viewer.

    Errors always take the shape `{"error":{"code","message"}}`. Branch on `code`,
    which is stable; `message` is written for a human and may be reworded or
    translated.

    ## Listing

    Every list endpoint takes the same parameters and answers the same shape.

    - `limit` — 1 to 100, default 25.
    - `offset` — 0 or more, default 0.
    - `q` — free text, case-insensitive, matched against whatever names the row to a
      person. Each endpoint says which fields those are.
    - `sort` — one of a fixed set per endpoint; anything else is refused.
    - `order` — `asc` or `desc`, default `desc`.

    The response carries the collection under its own name plus `total`: how many
    rows match the filters, ignoring `limit` and `offset`, so a table can say
    "1-25 of 340".

    A `limit` over 100, a negative `offset`, an unlisted `sort`, an `order` that is
    not `asc` or `desc`, and a malformed filter are each a `400` —
    `invalid_limit`, `invalid_offset`, `invalid_sort`, `invalid_order`,
    `invalid_filter`. None of them is silently clamped or ignored: a page quietly
    different from the one asked for is worse than a refusal you can see.
servers:
  - url: https://api.alchemist.example
paths:
  /healthz:
    get:
      summary: Liveness and database reachability
      security: []
      responses:
        "200": { description: Healthy }
        "503": { description: Database unavailable }

  /admin/tenants:
    get:
      summary: List tenants
      description: Operator surface. Requires ALCHEMIST_ADMIN_KEY, not a customer key.
      responses:
        "200": { description: Tenants }
        "401": { description: invalid_admin_key }
        "404": { description: Admin surface disabled (no admin key configured) }
    post:
      summary: Create a tenant
      description: |
        Operator surface, behind a separate credential so a leaked customer key cannot
        mint tenants or keys.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                ladder_profile:
                  type: string
                  default: bd-mobile
                  description: Must be an existing profile.
      responses:
        "201": { description: Tenant created }
        "400": { description: invalid_request or invalid_ladder_profile }
        "401": { description: invalid_admin_key }

  /admin/contact:
    get:
      summary: Read contact enquiries
      description: Operator surface. Requires ALCHEMIST_ADMIN_KEY.
      responses:
        "200": { description: Enquiries, newest first }
        "401": { description: Missing or invalid admin key }

  /admin/tenants/{id}/keys:
    post:
      summary: Issue an API key for a tenant
      description: |
        The plaintext key is returned once and never again; only its hash is stored.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, default: default }
      responses:
        "201": { description: Key issued; api_key shown once }
        "404": { description: tenant_not_found }

  /admin/tenants/{id}/live:
    put:
      summary: Turn the Live product on or off for a tenant
      description: |
        Operator surface. Live is a separate product from the VOD engine, and this is
        the line between what a customer has paid for and what they have not — so
        nothing a customer holds can move it.

        Off by default, including for a tenant with no limits row. Configuring an
        ingest host enables live for the *deployment*; this enables it for a tenant.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        "200": { description: Entitlement set }
        "400": { description: invalid_request }
        "401": { description: invalid_admin_key }

  /admin/keys/{keyID}:
    delete:
      summary: Revoke an API key
      description: Takes effect on the next request; there is no cached credential.
      parameters:
        - { name: keyID, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Revoked }
        "404": { description: key_not_found }

  /v1/auth/signup:
    post:
      summary: Create an organisation and its first account
      security: []
      description: |
        Self-service. Creates the tenant, the owner, and one API key in a single
        transaction, and starts a session. The API key is in the response and is
        never shown again — only its hash is stored.

        Mounted only when ALCHEMIST_WEB_ORIGINS names at least one browser origin.
      responses:
        "201": { description: Account created, session started, API key returned }
        "400": { description: Missing org, malformed email, or password under 10 characters }
        "409": { description: An account already exists for that email }
        "429": { description: Too many attempts from this address }

  /v1/contact:
    post:
      summary: Send an enquiry from the public site
      security: []
      description: |
        No account needed — that is the point. Same origin check and rate limit as
        signup. A filled `website` field is treated as a bot and answered as though
        it worked.

        Requests are readable only through the operator surface: the table has RLS
        forced and no policy, so a tenant-scoped connection sees nothing.
      responses:
        "202": { description: Received }
        "400": { description: Missing name, bad email, or a message under 10 characters }
        "429": { description: Too many attempts from this address }

  /v1/auth/login:
    post:
      summary: Start a session
      security: []
      description: |
        A wrong password and an unknown address answer identically, and take the
        same time, so the endpoint cannot be used to find out who has an account.
      responses:
        "200": { description: Session started }
        "401": { description: Email and password do not match }
        "429": { description: Too many attempts from this address }

  /v1/auth/logout:
    post:
      summary: End the current session
      security: []
      responses:
        "204": { description: Session ended, cookie cleared }

  /v1/auth/session:
    get:
      summary: Who the session belongs to
      security: []
      description: |
        `tenant_id` and `org` are the account the session is **currently acting as**,
        which for a platform administrator viewing a customer is that customer, not
        their own. `platform_admin` says whether this person is Alchemist staff and
        `impersonating` whether they are viewing someone else right now — draw an
        unmissable banner when it is true, because the session is read-only and every
        write will be refused with `read_only_session`.
      responses:
        "200":
          description: |
            `{user_id, tenant_id, email, org, platform_admin, impersonating}`.
        "401": { description: No live session }

  /e/{tenant}/{asset}:
    get:
      summary: The embed page for an iframe
      security: []
      description: |
        A thin page that loads the player bundle and plays the asset. Drop it in an
        `<iframe>`; it deliberately sets no `X-Frame-Options`, because being framed is
        the point.

        Authorised by the **playback signature**, not an API key — the caller is a
        viewer's browser. Mint the signed URL from `GET /v1/assets/{id}` and pass its
        query through unchanged: `vid` and `wm` travel on, so a link bound to one
        student stays bound and the watermark cannot be dropped by embedding it.

        Served only where a player bundle is configured (`ALCHEMIST_PLAYER_URL`);
        without one the page could only render an empty box.
      parameters:
        - { name: tenant, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: asset, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: exp, in: query, required: true, schema: { type: integer } }
        - { name: kid, in: query, required: true, schema: { type: string } }
        - { name: sig, in: query, required: true, schema: { type: string } }
        - name: format
          in: query
          description: "`dash` to embed the DASH manifest. Defaults to HLS; use the asset's `playback.preferred`."
          schema: { type: string, enum: [hls, dash] }
      responses:
        "200": { description: The embed page }
        "403": { description: playback_not_authorized }

  /v1/whoami:
    get:
      summary: Identify the authenticated tenant
      description: |
        `live_enabled` is true only when this tenant has bought Live **and** the
        deployment has an ingest host — a dashboard branching on it will not offer
        endpoints that are not mounted.
      responses:
        "200": { description: Tenant identity, ladder profile and live entitlement }
        "401": { description: Missing or invalid API key }

  /v1/uploads:
    post:
      summary: Start a direct upload
      description: |
        Returns a presigned target. Upload the file there with `PUT`, then call
        `/v1/assets/{id}/complete`. Bytes never pass through this API.

        The body is optional. `title` names the video; with no title, `filename` is
        used with its extension dropped. With neither, the video stays unnamed and
        lists show the short id — nothing is invented on your behalf.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string, maxLength: 200 }
                filename: { type: string, description: The file's own name, used when title is absent }
      responses:
        "400": { description: invalid_title }
        "201": { description: Upload target created }
        "429": { description: Concurrency or monthly quota reached }

  /v1/assets:
    get:
      summary: Your videos
      description: |
        `q` matches the title and the start of the id, so pasting either finds the
        video. `state` may be repeated to ask for several at once.

        `title` is null for a video nobody has named; show the first characters of
        the id instead.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Q'
        - $ref: '#/components/parameters/Order'
        - name: sort
          in: query
          schema: { type: string, enum: [created_at, duration_sec, source_bytes, state], default: created_at }
        - name: state
          in: query
          description: Repeat for several states.
          schema: { type: array, items: { type: string } }
      responses:
        "200": { description: Assets with title, state, duration and size, plus total }
        "400": { description: invalid_limit, invalid_offset, invalid_sort or invalid_order }
        "401": { description: Missing or invalid credentials }
    post:
      summary: Import a video from a URL
      description: |
        For migrating a library from another provider. The URL is re-validated at
        fetch time and on every redirect; addresses inside private, loopback or
        link-local ranges are refused.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string, format: uri }
                title:
                  type: string
                  maxLength: 200
                  description: |
                    Optional. Without it the last path segment of the URL is used,
                    percent-decoded and without its extension.
      responses:
        "202": { description: Import queued }
        "400": { description: missing_url, invalid_url or invalid_title }
        "429": { description: Quota reached }

  /v1/assets/{id}:
    get:
      summary: Fetch an asset
      description: |
        `playback` appears once the state is `ready` or `partially_ready`, and
        throughout a broadcast (`live_armed` while it waits for an encoder, `live`
        once one is publishing, then `live_ended`). URLs are signed and
        expire.

        **Hand the player whichever URL `playback.preferred` names.** Both `hls` and
        `dash` are always present, but encrypted media is packaged `cenc` and HLS has
        no `cenc` — its fMP4 encryption is the SAMPLE-AES family — so an encrypted
        asset plays over DASH and a clear one over HLS. `playback.encrypted` says
        which kind it is; `preferred` saves the caller having to know the rule.

        Pass `viewer` to bind the link to one person. The id is yours and stays
        opaque to us — it is signed, echoed back in the URL as `vid`, and never
        stored. A bound link cannot be edited to remove or change the binding, and
        it is what the per-viewer device cap counts against
        (`max_viewer_devices` in `/v1/playback-settings`). Beyond the cap the origin
        answers `403 viewer_limit_reached`.

        Pass `watermark` to carry a short label the player draws on screen, usually
        the student's own phone number or roll. It travels inside the signature as
        `wm`, so a viewer cannot strip it, and a leaked recording names the account
        it came from. Burning it into the video server-side is not offered: that is
        per-session encoding and costs a stream per viewer.

        Both accept letters, digits and `- . _ ~ @` only — `viewer` up to 64
        characters, `watermark` up to 48. Anything else is `400 invalid_viewer`.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - name: viewer
          in: query
          required: false
          description: Your opaque id for whoever is watching.
          schema: { type: string, maxLength: 64, pattern: '^[A-Za-z0-9._~@-]+$' }
        - name: watermark
          in: query
          required: false
          description: Short label the player renders on screen.
          schema: { type: string, maxLength: 48, pattern: '^[A-Za-z0-9._~@-]+$' }
      responses:
        "200": { description: Asset state and playback URLs }
        "400": { description: invalid_viewer }
        "404": { description: asset_not_found }
    patch:
      summary: Rename a video
      description: |
        `title` is the only thing about a video you choose; everything else is
        produced by the pipeline. Send `null`, or omit it, to clear the name — the
        video goes back to showing its short id rather than becoming "Untitled".

        Nothing in flight is affected: the name is a label and no encode, manifest
        or playback URL reads it.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string, maxLength: 200, nullable: true }
      responses:
        "200": { description: The video's id, title and state }
        "400": { description: invalid_title or invalid_request }
        "404": { description: asset_not_found — including another tenant's video, which RLS makes invisible rather than forbidden }
    delete:
      summary: Delete a video
      description: |
        Removes the asset and reclaims its objects in the background. Media that
        another asset shares — the same file uploaded twice is stored once — is left
        in place until the last asset that plays it is gone.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Deleted }
        "404": { description: asset_not_found }

  /v1/assets/{id}/complete:
    post:
      summary: Signal that an upload has finished
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "202": { description: Queued for processing }
        "404": { description: No upload awaiting that id }

  /v1/assets/{id}/retry:
    post:
      summary: Try a failed video again
      description: |
        Re-queues an encode that failed, without re-uploading. The source is still in
        storage — the original is deleted only after a successful publish — so this is
        a state reset plus a job, and the asset goes back to `uploaded`.

        Rendition rows from the failed attempt are discarded, so `chunks_done` and
        `chunks_total` start again from zero.

        Only a `failed` asset can be retried; anything else is `invalid_state`. A
        retry counts against the same ingest quota as a fresh upload.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "202": { description: Queued for processing }
        "401": { description: Missing or invalid credentials }
        "404": { description: asset_not_found }
        "409": { description: invalid_state, or source_gone when the original is no longer in storage }
        "429": { description: quota_exceeded }

  /v1/assets/{id}/captions:
    get:
      summary: The subtitle tracks on this video
      description: |
        Language, label, size and when each was last replaced. A deduplicated asset
        answers with the canonical asset's tracks, because it plays the canonical
        asset's manifests.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: The tracks, oldest language code first }
        "401": { description: Missing or invalid credentials }

  /v1/assets/{id}/captions/{lang}:
    put:
      summary: Add or replace a subtitle track
      description: |
        The body is the WebVTT file itself, not JSON — it is a file exported from
        somewhere else, and wrapping it in an envelope only adds a step to get wrong.
        Up to 2 MB. It must begin with `WEBVTT`; a malformed track shows a player no
        subtitles and no error, so it is refused here instead.

        Uploading the same language again replaces it, which is what correcting a
        typo in a transcript is. The manifests are rewritten in the background; the
        media is never touched, so nothing is evicted from any edge cache.

        Nothing is marked default. Subtitles a viewer did not ask for, switched on for
        them, is the setting people turn off and never turn back on.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - name: lang
          in: path
          required: true
          description: BCP-47, as the manifests carry it — bn, en, bn-BD.
          schema: { type: string }
        - name: label
          in: query
          description: What a viewer picks from the player's menu. Defaults to the language code.
          schema: { type: string, maxLength: 60 }
      requestBody:
        required: true
        content:
          text/vtt:
            schema: { type: string }
      responses:
        "200": { description: Stored }
        "400": { description: invalid_language, invalid_label or invalid_captions }
        "401": { description: Missing or invalid credentials }
        "404": { description: asset_not_found }
        "413": { description: caption_too_large }
    delete:
      summary: Remove a subtitle track
      description: |
        The manifests stop naming it first, then the file is reclaimed — the other
        order leaves a manifest pointing at a 404, which a player reports as a broken
        video rather than a missing track.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: lang, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Removed }
        "401": { description: Missing or invalid credentials }
        "404": { description: caption_not_found }

  /v1/keys:
    get:
      summary: List this tenant's API keys
      description: |
        Names and dates only. Keys are stored hashed, so an existing key cannot be
        shown again — a lost key is replaced, not recovered. `q` matches the name.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Q'
        - $ref: '#/components/parameters/Order'
        - name: sort
          in: query
          schema: { type: string, enum: [created_at, name], default: created_at }
        - name: revoked
          in: query
          description: true for revoked keys only, false for live ones.
          schema: { type: boolean }
      responses:
        "200": { description: Keys and total }
        "400": { description: invalid_limit, invalid_offset, invalid_sort, invalid_order or invalid_filter }
        "401": { description: Missing or invalid credentials }
    post:
      summary: Mint another API key
      responses:
        "201": { description: The new key, shown once }
        "400": { description: Name too long }
        "401": { description: Missing or invalid credentials }

  /v1/keys/{id}:
    patch:
      summary: Rename an API key
      description: |
        The secret is untouched, so code already holding this key keeps working. The
        name only tells one key from another. Revoking is `DELETE`.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 60 }
      responses:
        "200": { description: The key's id and new name }
        "400": { description: invalid_request }
        "404": { description: key_not_found }
    delete:
      summary: Revoke an API key
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Revoked }
        "404": { description: No such key, or it was already revoked }

  /v1/assets/{id}/chunks:
    get:
      summary: The chunk map for one asset
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      description: |
        Every chunk of every rendition, with its time range and whether it exists
        yet. This is what progress is made of.
      responses:
        "200": { description: Chunks, largest rendition first }
        "401": { description: Missing or invalid credentials }

  /v1/assets/{id}/activity:
    get:
      summary: What the pipeline did to one asset
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      description: |
        Queue steps with state, attempt count and timings. Deliberately not the
        error text: a queue failure carries whatever ffmpeg or the storage client
        said, including paths and internal arguments. The actionable part is the
        stable `error_code` on the asset itself.
      responses:
        "200": { description: Steps in the order they were queued }
        "404": { description: No such asset for this tenant }

  /v1/webhooks:
    get:
      summary: List webhook endpoints
      description: '`q` matches the URL.'
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Q'
        - $ref: '#/components/parameters/Order'
        - name: sort
          in: query
          schema: { type: string, enum: [created_at, url], default: created_at }
        - name: active
          in: query
          description: true for live endpoints only, false for paused ones.
          schema: { type: boolean }
      responses:
        "200": { description: Endpoints and total }
        "400": { description: invalid_limit, invalid_offset, invalid_sort, invalid_order or invalid_filter }
    post:
      summary: Register a webhook endpoint
      description: |
        The signing secret is returned once, here, and never again. Deliveries carry
        `X-Alchemist-Signature: sha256=<hmac>` over the raw body.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string, format: uri, description: Must be https }
                events:
                  type: array
                  items:
                    type: string
                    enum:
                      - asset.ready
                      - asset.failed
                      - rendition.ready
                      - live.started
                      - live.ended
                      - live.failed
      responses:
        "201": { description: Endpoint created; secret shown once }
        "400": { description: invalid_url or unknown_event }

  /v1/webhooks/{id}:
    get:
      summary: One webhook endpoint
      description: |
        Never the signing secret — it was shown once when the endpoint was created
        and only your side still holds a copy.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: URL, events and whether it is active }
        "404": { description: webhook_not_found }
    patch:
      summary: Change or pause a webhook endpoint
      description: |
        `active: false` is the pause: nothing is delivered while it is off, including
        events that happen meanwhile — they are not queued up for later. The signing
        secret is untouched, so resuming verifies with the secret you already have.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                url: { type: string, format: uri, description: Must be https }
                active: { type: boolean }
      responses:
        "200": { description: The endpoint as it now stands }
        "400": { description: invalid_url or invalid_request }
        "404": { description: webhook_not_found }
    delete:
      summary: Remove a webhook endpoint
      description: |
        Deliveries stop for good, including any already queued: a delivery reads the
        endpoint just before it posts and finds nothing. Its delivery history goes
        with it — pause with `active: false` instead to keep the record.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Removed }
        "404": { description: webhook_not_found }

  /v1/bucket-sources:
    get:
      summary: List connected buckets
      description: '`q` matches the bucket name and the prefix.'
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Q'
        - $ref: '#/components/parameters/Order'
        - name: sort
          in: query
          schema: { type: string, enum: [created_at, bucket], default: created_at }
        - name: state
          in: query
          schema: { type: string, enum: [active, paused] }
      responses:
        "200": { description: Sources with sync status, import counts and total }
        "400": { description: invalid_limit, invalid_offset, invalid_sort, invalid_order or invalid_filter }
    post:
      summary: Connect a customer-owned bucket
      description: |
        Ingests every video appearing under `prefix`. The secret is wrapped before
        storage and never returned again. A first scan starts immediately; afterwards
        a reconcile re-lists every 15 minutes, which is what makes the sync reliable
        when S3 event notifications are dropped or unsupported.

        Only known video extensions are taken, so PDFs and images in the same bucket
        are ignored. Re-listing never re-imports: objects are tracked by key and etag.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [endpoint, bucket, access_key_id, secret_access_key]
              properties:
                endpoint: { type: string, format: uri }
                region: { type: string, default: us-east-1 }
                bucket: { type: string }
                prefix: { type: string, default: "" }
                access_key_id: { type: string }
                secret_access_key: { type: string, description: Read access is sufficient }
      responses:
        "201": { description: Connected; first scan queued }
        "400": { description: invalid_url or invalid_request }

  /v1/bucket-sources/{id}:
    get:
      summary: One connected bucket
      description: Never the access keys; the secret is wrapped and is not readable here.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Bucket, prefix, sync status and import count }
        "404": { description: bucket_not_found }
    patch:
      summary: Pause or resume a bucket
      description: |
        `active: false` stops the next scan. Videos already imported are ordinary
        assets and are untouched, and an import already running finishes.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [active]
              properties:
                active: { type: boolean }
      responses:
        "200": { description: The source as it now stands }
        "400": { description: invalid_request }
        "404": { description: bucket_not_found }
    delete:
      summary: Disconnect a bucket
      description: |
        Refused with `409 bucket_in_use` while a video from this bucket is still
        being processed: the encoder reads the source object back through these
        credentials, so removing them mid-flight would leave the video stuck short of
        ready with nothing to explain it. Wait for those to finish, or pause instead.

        Otherwise the connection, its stored credentials and its record of which
        objects were taken all go. Videos already imported are yours and are kept;
        nothing in your bucket is touched. Reconnecting the same bucket imports it
        again from the start.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Disconnected }
        "404": { description: bucket_not_found }
        "409": { description: bucket_in_use }

  /v1/auth/invite:
    get:
      summary: Who an invite is for
      description: |
        Unauthenticated — the point is to show the address and organisation before
        there is an account. An unknown token and an expired one give the same 404,
        so this cannot be used to probe which addresses were invited where.
      parameters:
        - { name: token, in: query, required: true, schema: { type: string } }
      responses:
        "200": { description: Email, role and organisation name }
        "404": { description: invite_not_found }
    post:
      summary: Redeem an invite and sign in
      description: |
        Creates the user inside the inviting tenant and starts a session. This is the
        only way a second user is ever created; signup always makes a new tenant.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: { type: string }
                password: { type: string, minLength: 10 }
      responses:
        "201": { description: Account created and signed in }
        "400": { description: invalid_request or weak_password }
        "404": { description: invite_not_found }
        "409": { description: email_taken }

  /v1/members:
    get:
      summary: List teammates and pending invites
      description: |
        Session only. An API key is a machine credential and gets 403 `session_required`
        on every endpoint under `/v1/members`.

        `q` matches the email address. Paging applies to the team; pending invites
        are a short list and always come back whole, so `total` counts members only.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Q'
        - $ref: '#/components/parameters/Order'
        - name: sort
          in: query
          schema: { type: string, enum: [created_at, email, role], default: created_at }
        - name: role
          in: query
          schema: { type: string, enum: [owner, admin, member] }
      responses:
        "200": { description: Members, pending invites, and a total of members }
        "400": { description: invalid_limit, invalid_offset, invalid_sort, invalid_order or invalid_filter }
        "403": { description: session_required }

  /v1/members/invites:
    post:
      summary: Invite someone to the account
      description: |
        The invite token is returned once, here, and never again — there is no mail
        sender in this repo yet, so the dashboard shows the link to pass on. Owner or
        admin only; only an owner can invite another owner. Invites last seven days,
        and a second invite to the same address replaces the first.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
                role: { type: string, enum: [owner, admin, member], default: member }
      responses:
        "201": { description: Invited; token shown once }
        "400": { description: invalid_email or invalid_role }
        "403": { description: session_required or not_permitted }
        "409": { description: already_a_member }

  /v1/members/invites/{id}:
    delete:
      summary: Withdraw a pending invite
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Withdrawn }
        "403": { description: session_required or not_permitted }
        "404": { description: not_found }

  /v1/members/{id}:
    patch:
      summary: Change a teammate's role
      description: |
        Only an owner can grant ownership, and the last owner cannot be demoted —
        an account with no owner is one nothing in the API can repair.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { type: string, enum: [owner, admin, member] }
      responses:
        "200": { description: Role changed }
        "400": { description: invalid_role }
        "403": { description: session_required or not_permitted }
        "404": { description: not_found }
        "409": { description: last_owner }
    delete:
      summary: Remove a teammate
      description: |
        Sessions cascade with the user, so this signs them out everywhere. You cannot
        remove yourself, and you cannot remove the last owner.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Removed }
        "403": { description: session_required or not_permitted }
        "404": { description: not_found }
        "409": { description: last_owner or cannot_remove_self }

  /v1/migration-providers:
    get:
      summary: Which video hosts we can migrate a library from
      description: |
        Each entry names the service, what to ask for (`secret.kind` is `key` for a
        credential or `text` for a pasted list), and any non-secret settings it needs.

        Hosts that expose no downloadable original through their API are absent
        rather than listed: a platform built around locked-down delivery hands out no
        source file by design. The `csv` provider is the way across from those — you
        supply the links yourself and we fetch them through the same guarded path as
        any other URL import.
      responses:
        "200": { description: Providers and the settings each needs }

  /v1/migrations:
    get:
      summary: Migrations you have started, and how far each has got
      description: |
        `total` is how many videos we found on the far side, `handled` how many of
        them we have finished with, so progress reads as a proportion rather than a
        bare number. `preview_done` says the list is complete and waiting on you.

        `q` matches the provider name. `total` on the response is how many migrations
        match — not to be confused with each migration's own `total`, which counts
        the videos in it.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Q'
        - $ref: '#/components/parameters/Order'
        - name: sort
          in: query
          schema: { type: string, enum: [created_at, state], default: created_at }
        - name: state
          in: query
          schema: { type: string }
      responses:
        "200": { description: Sources with their counts, and a total of migrations }
        "400": { description: invalid_limit, invalid_offset, invalid_sort or invalid_order }
    post:
      summary: Migrate a library in from another video host
      description: |
        Session only — handing over another service's API key is account
        administration, not something a machine credential should be able to do.

        The key is encrypted before storage, bound to this one migration, and never
        returned. Nothing is imported yet: the migration starts in `previewing`,
        where we only page through the far side's library and write down what is
        there. Call `/confirm` once you have read the list and importing begins.

        Re-running is safe: videos are tracked by their remote id, so nothing is
        imported twice.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider, secret]
              properties:
                provider: { type: string, enum: [vimeo, bunny, csv] }
                secret:
                  type: string
                  description: |
                    The provider's API key, or for `csv` the list itself — one link
                    per line, or a CSV with a url column and an optional title.
                config:
                  type: object
                  description: Non-secret settings the provider needs, such as a Bunny library id.
                  additionalProperties: { type: string }
      responses:
        "201": { description: Created in previewing; nothing is imported yet }
        "400": { description: unknown_provider or invalid_request }
        "403": { description: session_required }

  /v1/migrations/{id}:
    delete:
      summary: Forget a migration
      description: |
        Stops it and removes the source and its stored key. Videos already brought
        across are your assets now and are kept; nothing on the far side is touched.
        Session only.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Removed }
        "403": { description: session_required }
        "404": { description: not_found }

  /v1/migrations/{id}/confirm:
    post:
      summary: Approve the preview and start importing
      description: |
        Until this is called a migration has imported nothing — it has only listed
        what is there. This moves it to `scanning`, which is when assets are created
        and encoding is queued. Only valid once the preview has finished listing.
        Session only.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Now scanning }
        "403": { description: session_required }
        "404": { description: not_found }
        "409": { description: invalid_state }

  /v1/migrations/{id}/pause:
    post:
      summary: Stop taking new pages
      description: |
        The migration stops after the page it is on. Nothing already imported is
        undone. Session only.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Now paused }
        "403": { description: session_required }
        "404": { description: not_found }
        "409": { description: invalid_state }

  /v1/migrations/{id}/resume:
    post:
      summary: Carry on from where it stopped
      description: |
        Picks up at the stored cursor. Videos already across are not fetched again —
        they are matched on their remote id, and on their source URL account-wide.
        Session only.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Scanning again }
        "403": { description: session_required }
        "404": { description: not_found }
        "409": { description: invalid_state }

  /v1/migrations/{id}/items:
    get:
      summary: Which videos came across, and which did not
      description: |
        A video the far side will not hand over is recorded as skipped with a reason
        rather than failing the whole migration, so a partial result is explainable.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Up to 500 items, newest first }

  /internal/live/authorize:
    post:
      summary: Authorize a publisher (ingest server only)
      description: |
        Not part of the customer API. The ingest server calls this before accepting a
        publisher, and it is the only thing standing between a stream key and someone
        else's broadcast — so it must be bound to a private interface and never
        exposed publicly. See `deploy/README.md`.

        It carries no API key, because the caller has none: the stream key inside the
        request body is the credential. A publish is allowed only when the key
        resolves to a live stream **and** that stream is the path being published to.
        Checking the key alone would let one valid key publish over every other
        stream on the server.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                action: { type: string, description: Only "publish" is ever allowed }
                path: { type: string, description: The live stream's id }
                password: { type: string, description: The stream key }
                token: { type: string, description: The stream key, if sent as a token }
                protocol: { type: string }
                ip: { type: string }
      responses:
        "204": { description: The publisher may proceed }
        "401": { description: Refused. No detail is returned, deliberately }

  /v1/live-streams:
    get:
      summary: Your live streams
      description: |
        Present only when this deployment has live ingest configured. Without an
        ingest host there is nowhere for an encoder to connect, so the endpoints are
        not served at all rather than served and always failing.

        Live is a separate product. A tenant who has not bought it gets
        `live_not_enabled` from every endpoint here, whatever the deployment supports.

        `q` matches the name and the start of the id. `state` may be repeated.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Q'
        - $ref: '#/components/parameters/Order'
        - name: sort
          in: query
          schema: { type: string, enum: [created_at, name, state], default: created_at }
        - name: state
          in: query
          description: Repeat for several states.
          schema: { type: array, items: { type: string } }
        - name: protocol
          in: query
          schema: { type: string, enum: [camera, srt, rtmp] }
      responses:
        "200": { description: Streams and total }
        "400": { description: invalid_limit, invalid_offset, invalid_sort or invalid_order }
        "403": { description: live_not_enabled }
    post:
      summary: Create a live stream
      description: |
        Returns the stream key **once**. Only its hash is stored, so a lost key is
        replaced rather than recovered.

        Creating a stream reserves nothing. Call `start` when you are ready to go on
        air; that is what takes an ingest port and waits for your encoder.

        `protocol` names what the customer publishes *from*, not only what goes over
        the wire. `camera` is a browser with a webcam, which needs no encoder at all;
        `srt` and `rtmp` are the two answers to "my encoder". SRT is the default
        because it holds up on a lossy uplink, and RTMP is there for hardware encoders
        that speak nothing else.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                protocol: { type: string, enum: [srt, rtmp, camera], default: srt }
      responses:
        "201": { description: The stream, including its key, shown this once only }
        "400": { description: invalid_request, invalid_protocol }

  /v1/live-streams/{id}:
    get:
      summary: One live stream and its current state
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: State, and the asset the latest broadcast is watched at }
        "404": { description: stream_not_found }
    patch:
      summary: Rename a live stream
      description: |
        Allowed at any time, including while the stream is armed or on air. Nothing
        in flight reads the name: the encoder is authorised by its key and the
        broadcast is watched at its own asset, so a rename is a label change and
        refusing one mid-class would only leave the dashboard showing the wrong name.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 120 }
      responses:
        "200": { description: The stream as it now stands }
        "400": { description: invalid_request }
        "403": { description: live_not_enabled }
        "404": { description: stream_not_found }
    delete:
      summary: Delete a live stream
      description: |
        Removes the stream and its sessions. Anything already broadcast stays as its
        own asset and is deleted through the asset.

        Refused with `stream_on_air` while the stream is armed or live. Sessions
        cascade from the stream, so deleting one mid-broadcast takes away the only row
        that knows which segments to reclaim, and they are paid for forever. Stop it,
        then delete it.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Deleted }
        "404": { description: stream_not_found }
        "409": { description: stream_on_air }

  /v1/live-streams/{id}/key:
    post:
      summary: Replace the stream key
      description: |
        Mints a new key and forgets the old one. There is no way to see an existing
        key again — only its hash is stored, exactly like an API key — so this is both
        the answer to "I did not write it down" and the fix for a leaked one.

        The new key is returned **once**. An encoder already publishing keeps going:
        the ingest server checks the key at handshake and does not re-check mid
        connection, so it is the next connection that needs the new one.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: The new key, shown once }
        "403": { description: live_not_enabled }
        "404": { description: stream_not_found }

  /v1/live-streams/{id}/start:
    post:
      summary: Go on air
      description: |
        Creates the video the broadcast will be watched at and waits for your encoder.
        One ingest port serves every stream; the ingest server dispatches on the path
        and authorises the (key, path) pair before it accepts a publisher.

        For SRT and RTMP the response carries `ingest_server` and `ingest_stream_key`
        — the two fields an encoder's settings screen actually has. OBS joins them
        with a slash, so pasting one combined URL publishes to a path nothing
        authorised. `ingest_url` is the same address as one string, for a client that
        would rather have it that way. Where `ingest_stream_key` holds
        `YOUR_STREAM_KEY`, substitute the key you were given when the stream was
        created; only its hash is stored, so it cannot be filled in for you.

        A `camera` stream comes back with a WHIP endpoint as `ingest_url` and a
        `publish_token` beside it, because a browser is the encoder and has no key to
        paste. Send the SDP offer as `POST {ingest_url}` with
        `Authorization: Bearer publisher:{publish_token}` — the ingest server reads
        WebRTC credentials from that header and ignores them in the query string. The
        token is minted for this broadcast and replaces the stream key, so the
        credential in page script lives one session.

        The video is playable from the first segment: fetch it at
        `GET /v1/assets/{asset_id}` and use the playback URLs there, exactly as you
        would for an upload. When the broadcast ends the same URL keeps working.

        Ingest is currently authorised by the port, not by the stream key — the port
        is opened only for this broadcast, and the range should be reachable only
        from your encoders.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "202": { description: Armed. Carries ingest_url, asset_id and session_id }
        "404": { description: stream_not_found }
        "409": { description: stream_busy }
        "503": { description: no_ingest_port }

  /v1/live-streams/{id}/stop:
    post:
      summary: End a broadcast that is on air
      description: |
        Until this existed a broadcast ended only when the encoder disconnected or the
        health reaper timed it out, so a customer who closed OBS badly, or wanted to
        finish a class early, had no way to stop.

        It records the intent and returns immediately: the thing holding the encoder
        is a worker in another process, and it picks this up on its next poll, within
        a second. A stopped broadcast then goes down the ordinary ending path, so its
        recording converts exactly as one whose encoder hung up does.

        Stopping before anything was sent leaves no recording. The broadcast ends with
        `stopped`, which is a stated outcome rather than a fault.

        A broadcast that has already ended cannot be stopped, and asking answers
        `not_broadcasting` — that is what keeps a recording part way through
        conversion from being stranded.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "202": { description: The worker will end it on its next poll }
        "403": { description: live_not_enabled }
        "404": { description: stream_not_found }
        "409": { description: not_broadcasting }

  /v1/edits:
    get:
      summary: Edits you have made
      description: |
        `q` matches the start of the source video's id; `asset_id` is the exact-match
        version of the same thing, and the two can be combined.
      parameters:
        - { name: asset_id, in: query, schema: { type: string, format: uuid },
            description: Only edits of this video. }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Q'
        - $ref: '#/components/parameters/Order'
        - name: sort
          in: query
          schema: { type: string, enum: [created_at, state], default: created_at }
        - name: state
          in: query
          schema: { type: string, enum: [queued, rendering, done, failed] }
      responses:
        "200": { description: Edits with their state and what they did, plus total }
        "400": { description: invalid_limit, invalid_offset, invalid_sort or invalid_order }
    post:
      summary: Cut, crop, reframe or resize a video
      description: |
        An edit reads one video and produces a **new** one. The source is never
        changed — somebody may already have handed out a link to it — and the result
        goes through the ordinary pipeline, so it gets its own ladder and its own
        playback URLs.

        Editing renders from the mezzanine, not the original upload, so it keeps
        working after the original has been deleted.

        Coordinates are fractions of the source, 0 to 1, not pixels: a box drawn on a
        preview at whatever size a browser happened to render it means nothing here.
        `end_sec` of 0 means "to the end", `aspect` reframes by covering and centre
        cropping (never letterboxing), and `width` sets the output size with the
        height following the shape.

        The video must have finished processing — there is nothing to cut before a
        mezzanine exists.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [asset_id]
              properties:
                asset_id: { type: string, format: uuid }
                ops:
                  type: object
                  properties:
                    start_sec: { type: number, minimum: 0 }
                    end_sec: { type: number, minimum: 0, description: 0 means to the end }
                    crop_x: { type: number, minimum: 0, maximum: 1 }
                    crop_y: { type: number, minimum: 0, maximum: 1 }
                    crop_w: { type: number, minimum: 0, maximum: 1 }
                    crop_h: { type: number, minimum: 0, maximum: 1 }
                    aspect: { type: string, example: "9:16" }
                    width: { type: integer, maximum: 7680 }
                    mute: { type: boolean }
                    overlays:
                      type: array
                      maxItems: 8
                      description: |
                        Text and images drawn on top, in order. Text is rendered by us
                        in the product's own typeface rather than by ffmpeg, so it does
                        not depend on how ffmpeg was built.

                        `source` names WHAT to put on, never where it is: `logo` means
                        this account's own logo. A storage key is refused — it would be
                        a way to name another account's object and have us fetch it.

                        `scale` and `margin` are fractions of the frame, so an overlay
                        keeps its proportions when the video is reshaped.
                      items:
                        type: object
                        required: [kind]
                        properties:
                          kind: { type: string, enum: [text, image] }
                          text: { type: string }
                          colour: { type: string, example: "#ffffff" }
                          shadow: { type: boolean }
                          source: { type: string, enum: [logo] }
                          at:
                            type: string
                            enum: [top-left, top-right, bottom-left, bottom-right, centre, free]
                            description: |
                              `free` reads `x`/`y` instead of a corner. A corner keeps
                              meaning the corner when the frame is reshaped from wide
                              to upright; a dragged coordinate does not.
                          x: { type: number, minimum: 0, maximum: 1, description: Top-left of the overlay, when at is free }
                          y: { type: number, minimum: 0, maximum: 1, description: Top-left of the overlay, when at is free }
                          scale: { type: number, minimum: 0, maximum: 1 }
                          margin: { type: number, minimum: 0, maximum: 0.5 }
                          opacity: { type: number, minimum: 0, maximum: 1 }
                          start_sec: { type: number }
                          end_sec: { type: number }
      responses:
        "201": { description: Queued; poll the edit for its output asset }
        "400": { description: invalid_edit or invalid_request }
        "404": { description: asset_not_found }
        "409": { description: not_ready — the video is still being processed }

  /v1/edits/{id}:
    delete:
      summary: Forget an edit
      description: |
        Removes the record only. The video it produced is an asset like any other and
        is deleted through the asset, not by discarding the edit that made it.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Forgotten }
        "404": { description: not_found }

  /v1/ladder-profiles:
    get:
      summary: The encoding presets, and which one this account is on
      description: |
        A preset is a ladder: which heights we make, at what bitrates, and which of
        them are built lazily on first play rather than on ingest.
      responses:
        "200": { description: Presets, each flagged whether it is the current one }

  /v1/ladder-profile:
    put:
      summary: Choose the preset new uploads are built against
      description: |
        Existing assets keep the profile they were encoded with. Re-encoding a whole
        library because a setting moved would be a surprise that costs real money.
        Session only, owner or admin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [profile]
              properties:
                profile: { type: string }
      responses:
        "200": { description: Changed }
        "400": { description: unknown_profile }
        "403": { description: session_required or not_permitted }

  /v1/playback-settings:
    get:
      summary: How your videos are delivered
      responses:
        "200": { description: Whether playback encryption is on, and the device cap }
    put:
      summary: Playback encryption and the per-viewer device cap
      description: |
        **`encrypt_playback` is on by default for new accounts.** Media is packaged
        `cenc` and the key endpoint answers an EME Clear Key licence, which Chrome,
        Firefox and Edge play with no licence vendor.

        Be clear about what it does: this is **encryption at rest, not DRM**. The key
        is handed to the browser in the clear behind the signed URL, so it does not
        stop a viewer who is allowed to watch from keeping a copy. What it buys is
        that a lifted bucket or a stolen backup decodes to nothing. Sharing is
        addressed by `max_viewer_devices` and by binding links to a viewer, not by
        this.

        **Safari and iOS cannot play encrypted assets.** WebKit's only key system is
        FairPlay, which needs an Apple certificate and a licence server. Those viewers
        get `403 browser_not_supported` from the key endpoint, with a message saying
        which browsers work. Turn encryption off for the account if your audience is
        mostly on Apple devices.

        `max_viewer_devices` caps how many devices one viewer may stream from at
        once, 0–20, where **0 means no cap**. It applies only to links minted with
        `GET /v1/assets/{id}?viewer=...`; unbound links are not counted. A device is
        the viewer's address and browser taken together, and one that has not asked
        for a playlist in a couple of minutes gives its slot back. Past the cap the
        newest device is refused — `403 viewer_limit_reached` — never the one already
        watching, so a shared password cannot boot the student who paid out of their
        own lecture.

        Videos already published keep whatever they were made with: re-packaging a
        library on a settings change would rewrite every object and evict the lot
        from every edge cache.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [encrypt_playback]
              properties:
                encrypt_playback: { type: boolean }
                max_viewer_devices: { type: integer, minimum: 0, maximum: 20 }
      responses:
        "200": { description: Changed; applies to the next video processed }
        "400": { description: invalid_request }
        "403": { description: session_required or not_permitted }

  /v1/branding:
    get:
      summary: The account's name and logo
      responses:
        "200": { description: Name, logo URL and when the logo last changed }

  /v1/branding/logo:
    put:
      summary: Replace the account logo
      description: |
        Raw image bytes, at most 1 MB, `Content-Type` one of image/png, image/jpeg or
        image/webp. The magic bytes must match the declared type. SVG is refused: it
        is a document that can carry script, and a logo is not worth that. Session
        only, owner or admin.
      requestBody:
        required: true
        content:
          image/png: { schema: { type: string, format: binary } }
          image/jpeg: { schema: { type: string, format: binary } }
          image/webp: { schema: { type: string, format: binary } }
      responses:
        "200": { description: Stored; returns the public URL }
        "400": { description: invalid_image }
        "403": { description: session_required or not_permitted }
        "413": { description: image_too_large }
    delete:
      summary: Remove the account logo
      responses:
        "204": { description: Removed }
        "403": { description: session_required or not_permitted }

  /brand/{tenant}/logo:
    get:
      summary: The account logo, unauthenticated
      description: |
        Public on purpose: a viewer with no account and no key still has to see it.
        Nothing else under the tenant prefix is reachable through this route.
      parameters:
        - { name: tenant, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: The image }
        "404": { description: No logo set }

  /v1/usage:
    get:
      summary: Billable usage for a period
      description: |
        One line per kind and unit: `ingest` in seconds, per asset; `egress` in bytes
        and `storage` in gb_hours, aggregated per day rather than per request.
      parameters:
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
      responses:
        "200": { description: Aggregated usage lines }
        "400": { description: invalid_date or invalid_range }

  /playback/{tenant}/{asset}/{file}:
    get:
      summary: Fetch a manifest or media byte range
      security: []
      description: |
        Supports `Range`, `ETag` and `If-None-Match`. Media is immutable and cacheable
        indefinitely; manifests carry a short TTL and are rewritten per request so
        their relative URIs stay authorized.
      parameters:
        - { name: tenant, in: path, required: true, schema: { type: string } }
        - { name: asset, in: path, required: true, schema: { type: string } }
        - { name: file, in: path, required: true, schema: { type: string } }
        - { name: exp, in: query, required: true, schema: { type: integer } }
        - { name: kid, in: query, required: true, schema: { type: string } }
        - { name: sig, in: query, required: true, schema: { type: string } }
        - name: vid
          in: query
          required: false
          description: |
            Present on a bound link. Covered by `sig`, so it cannot be removed or
            changed. Playlist requests carrying it are counted against the account's
            device cap.
          schema: { type: string }
        - name: wm
          in: query
          required: false
          description: |
            Present on a bound link. The watermark label the player renders, covered
            by `sig`.
          schema: { type: string }
      responses:
        "200": { description: Full object }
        "206": { description: Byte range }
        "304": { description: Not modified }
        "403": { description: playback_not_authorized or viewer_limit_reached }
        "404": { description: not_found }
        "416": { description: range_not_satisfiable }
    head:
      summary: Headers for a manifest or media object
      security: []
      parameters:
        - { name: tenant, in: path, required: true, schema: { type: string } }
        - { name: asset, in: path, required: true, schema: { type: string } }
        - { name: file, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Headers only }
        "403": { description: playback_not_authorized }
    options:
      summary: CORS preflight
      security: []
      parameters:
        - { name: tenant, in: path, required: true, schema: { type: string } }
        - { name: asset, in: path, required: true, schema: { type: string } }
        - { name: file, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Allowed methods and headers }

  /playback/{tenant}/{asset}/key:
    get:
      summary: Fetch the EME Clear Key licence
      security: []
      description: |
        Authorized by the same signature as the media, and never cached. Returns an
        EME Clear Key licence, `application/json`:

            {"keys":[{"kty":"oct","kid":"<base64url>","k":"<base64url>"}],
             "type":"temporary"}

        Base64url is unpadded. Chrome, Firefox and Edge all support Clear Key with
        the `cenc` scheme this media is packaged in. **Safari and iOS cannot** —
        WebKit's only key system is FairPlay — and they get
        `403 browser_not_supported` here rather than a player that never starts.

        This is encryption, not DRM: the key is delivered to the browser behind the
        signed URL. What it protects is the media at rest, so a lifted bucket or a
        stolen backup decodes to nothing.
      parameters:
        - { name: tenant, in: path, required: true, schema: { type: string } }
        - { name: asset, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Clear Key licence JSON }
        "403": { description: playback_not_authorized or browser_not_supported }
        "404": { description: not_found — the asset is not encrypted }
    post:
      summary: Request the licence the way EME does
      security: []
      description: |
        The same licence as `GET`. Players built on shaka send the EME challenge as a
        POST body; Clear Key needs nothing from it, and it is read and discarded.
      parameters:
        - { name: tenant, in: path, required: true, schema: { type: string } }
        - { name: asset, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Clear Key licence JSON }
        "403": { description: playback_not_authorized or browser_not_supported }
        "404": { description: not_found — the asset is not encrypted }
    head:
      summary: Headers for the content key
      security: []
      parameters:
        - { name: tenant, in: path, required: true, schema: { type: string } }
        - { name: asset, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Headers only }
    options:
      summary: CORS preflight
      security: []
      parameters:
        - { name: tenant, in: path, required: true, schema: { type: string } }
        - { name: asset, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Allowed methods and headers }

  /playback/{tenant}/{asset}/beacon:
    post:
      summary: Report playback quality
      security: []
      description: |
        Sent by the viewer's player. Always answers 204, including for malformed
        bodies, so telemetry never causes a retry or a visible error. Values are
        clamped rather than rejected.
      parameters:
        - { name: tenant, in: path, required: true, schema: { type: string } }
        - { name: asset, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Accepted or discarded }
        "403": { description: playback_not_authorized }
    options:
      summary: CORS preflight for beacons
      security: []
      parameters:
        - { name: tenant, in: path, required: true, schema: { type: string } }
        - { name: asset, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Allowed methods and headers }

  /v1/staff/tenants:
    get:
      summary: Every account (Alchemist staff only)
      description: |
        The picker impersonation starts from. Names and counts only — no customer
        content crosses tenants anywhere in this API. `q` matches the account name
        and the start of the id.

        Session only, and only for a platform administrator: an API key gets
        `403 session_required`, anybody else `403 staff_only`.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Q'
        - $ref: '#/components/parameters/Order'
        - name: sort
          in: query
          schema: { type: string, enum: [created_at, name, assets], default: created_at }
      responses:
        "200":
          description: |
            `{tenants: [{tenant_id, name, assets, live_streams, members, created_at}],
            total}`.
        "400": { description: invalid_limit, invalid_offset, invalid_sort or invalid_order }
        "403": { description: session_required or staff_only }

  /v1/staff/impersonate:
    post:
      summary: View an account as its customer sees it (Alchemist staff only)
      description: |
        Sets the acting tenant on the session. Every other endpoint then answers for
        that account with no change in how it is called — support sees exactly what
        the customer sees, rather than a parallel view that drifts from it.

        **The session becomes read-only.** Any `POST`, `PATCH`, `PUT` or `DELETE`
        while impersonating is refused with `403 read_only_session`, except this
        endpoint's own `DELETE`. Operator changes still go through `/admin/*` with
        the static admin key.

        The acting tenant is stored on the session, not sent per request, and the
        `platform_admin` flag is re-read on every request: revoke it and impersonation
        stops on the next call.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenant_id]
              properties:
                tenant_id: { type: string, format: uuid }
      responses:
        "200": { description: '`{tenant_id, impersonating: true, read_only: true}`' }
        "400": { description: invalid_request }
        "403": { description: session_required or staff_only }
        "404": { description: tenant_not_found }
    delete:
      summary: Stop viewing an account (Alchemist staff only)
      description: |
        Clears the acting tenant; the session returns to its own. Allowed while the
        session is read-only, since it is what ends the read-only state.
      responses:
        "200": { description: '`{impersonating: false}`' }
        "403": { description: session_required or staff_only }

  /v1/assets/{id}/diagnostics:
    get:
      summary: Queue history with the raw error text (Alchemist staff only)
      description: |
        What `/v1/assets/{id}/activity` deliberately withholds. A queue failure
        carries whatever ffmpeg or the storage client said — paths, hostnames,
        internal arguments — so a customer gets the stable `error_code` and staff get
        this. Scoped to the tenant in scope like any other endpoint, so it reads the
        account currently being impersonated.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: |
            `{asset: {id, tenant_id, state, error_code, deduplicated_from,
            media_prefix}, jobs: [{id, kind, state, attempt, max_attempts, queue,
            queued_at, scheduled_at, started_at, finished_at, errors}]}`. `errors` is
            the `river_job` array untouched: each entry carries `at`, `attempt`,
            `error` and `trace`.
        "403": { description: session_required or staff_only }
        "404": { description: asset_not_found }

  /v1/live-sessions/{id}/diagnostics:
    get:
      summary: One broadcast, with the raw error text (Alchemist staff only)
      description: |
        `last_seen_at` is when a segment last landed, which is the difference between
        "the encoder never arrived" and "it stopped mid-match". The jobs are the queue
        rows for the broadcast's asset, error text included.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: |
            `{session: {id, stream_id, stream_name, stream_protocol, stream_state,
            asset_id, asset_state, state, error_code, started_at, ended_at,
            last_seen_at, stop_requested_at, swept_at, created_at}, jobs: [...]}`.
        "403": { description: session_required or staff_only }
        "404": { description: session_not_found }

  /internal/verify-playback:
    get:
      summary: Authorize a playback request without returning content
      security: []
      description: |
        For edges and CDNs that cannot run njs. Called as an nginx `auth_request`
        subrequest, which MUST happen before the cache lookup: the media cache key
        excludes the signature.
      responses:
        "204": { description: Authorized }
        "403": { description: Refused }

components:
  parameters:
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    Offset:
      name: offset
      in: query
      schema: { type: integer, minimum: 0, default: 0 }
    Q:
      name: q
      in: query
      description: Free-text search. See the endpoint for which fields it matches.
      schema: { type: string }
    Order:
      name: order
      in: query
      schema: { type: string, enum: [asc, desc], default: desc }
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
security:
  - apiKey: []
