# Local harness: the real deploy/edge/nginx.conf minus TLS and njs (no njs module in
# Homebrew nginx). Signature checking falls through to the origin here; the cache
# behaviour under test -- slicing, keying, locking, stale-serving -- is identical.
worker_processes 2;
daemon off;
pid /tmp/alcedge/nginx.pid;
error_log /tmp/alcedge/logs/error.log warn;
events { worker_connections 1024; }

http {
    include /opt/homebrew/etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /tmp/alcedge/logs/access.log;
    client_body_temp_path /tmp/alcedge/tmp;
    proxy_temp_path /tmp/alcedge/tmp/proxy;
    fastcgi_temp_path /tmp/alcedge/tmp/fcgi;
    uwsgi_temp_path /tmp/alcedge/tmp/uwsgi;
    scgi_temp_path /tmp/alcedge/tmp/scgi;

    proxy_cache_path /tmp/alcedge/cache/media levels=2:2 keys_zone=media:32m
                     max_size=2g inactive=30d use_temp_path=off;
    proxy_cache_path /tmp/alcedge/cache/manifest levels=1:2 keys_zone=manifest:8m
                     max_size=256m inactive=10m use_temp_path=off;

    upstream origin { server 127.0.0.1:8099; keepalive 32; }

    server {
        listen 8088;

        # Authorization runs BEFORE any cache lookup. The media cache key excludes
        # the signature, so without this an unsigned request is served from cache.
        location = /_auth {
            internal;
            proxy_pass              http://origin/internal/verify-playback;
            proxy_pass_request_body off;
            proxy_set_header        Content-Length "";
            proxy_set_header        X-Original-URI $request_uri;
        }

        location ~ ^/playback/[^/]+/[^/]+/key$ {
            auth_request /_auth;
            proxy_pass http://origin;
            proxy_cache off;
        }

        location ~ \.(m3u8|mpd)$ {
            auth_request /_auth;
            proxy_pass        http://origin;
            proxy_cache       manifest;
            proxy_cache_key   "$uri$is_args$args";
            proxy_cache_valid 200 2s;
            add_header X-Cache-Status $upstream_cache_status always;
        }

        location /playback/ {
            auth_request /_auth;
            slice 1m;
            proxy_pass         http://origin;
            proxy_cache        media;
            proxy_cache_key    "$uri$slice_range";
            proxy_set_header   Range $slice_range;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_cache_valid  200 206 30d;
            proxy_cache_lock   on;
            proxy_cache_lock_age 20s;
            proxy_cache_lock_timeout 20s;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_revalidate on;
            add_header X-Cache-Status $upstream_cache_status always;
            add_header Access-Control-Expose-Headers "Content-Length, Content-Range, ETag, Accept-Ranges" always;
        }

        location = /healthz { return 200 "edge ok\n"; }
    }
}
