# Alchemist BDIX edge cache (Dhaka).
#
# A stateless nginx cache. If this node dies, BD traffic falls back to the origin --
# slower and metered, but working. That failure mode is fine for a cache and would
# not be for storage, which is why storage lives in Singapore and this does not.

worker_processes auto;
events { worker_connections 8192; }

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    tcp_nopush    on;
    aio           threads;

    log_format edge '$remote_addr $status $request_time '
                    'cache=$upstream_cache_status bytes=$body_bytes_sent "$request"';
    access_log /var/log/nginx/edge.log edge buffered=64k;

    # Two tiers. Media is sliced into fixed blocks so a range request for the middle
    # of a two-hour lecture fetches one 1MB block, not the whole file. Manifests are
    # tiny, rewritten per request, and must not share a cache with media.
    proxy_cache_path /var/cache/nginx/media levels=2:2 keys_zone=media:256m
                     max_size=400g inactive=30d use_temp_path=off;
    proxy_cache_path /var/cache/nginx/manifest levels=1:2 keys_zone=manifest:16m
                     max_size=2g inactive=10m use_temp_path=off;

    upstream origin {
        server ORIGIN_HOST:443;
        keepalive 64;
    }

    js_import auth from /etc/nginx/njs/playback_auth.js;

    server {
        listen 80;
        listen 443 ssl http2;
        server_name cdn.alchemist.example;

        ssl_certificate     /etc/nginx/tls/fullchain.pem;
        ssl_certificate_key /etc/nginx/tls/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_session_cache   shared:SSL:32m;

        # Every key the edge will accept. Rotation: add the new key here and reload,
        # then switch which key the control plane signs with, then remove the old one.
        # No window where valid links break.
        set $playback_keys 'k1:dev-only-playback-key-change-me-32b';

        # Signature is checked here, in the worker. A cache hit therefore touches
        # neither the origin nor the database.
        location = /_auth {
            internal;
            js_content auth.authorize;
        }

        # /internal/ answers the ingest server and the origin's own signature check.
        # Both fail closed without credentials, but neither is a viewer's business and
        # nothing else here would stop a stranger hammering them: the app serves them
        # on the same listener as the customer API, because that API has to be public.
        location ^~ /internal/ { return 404; }

        # SECURITY: auth_request must stay on every location below. The media cache
        # key excludes the signature, so without it a warmed slice is served to any
        # unsigned request. See deploy/README.md.
        location /playback/ {
            auth_request /_auth;

            # The content key is per-viewer and short-lived: never cache it.
            location ~ ^/playback/[^/]+/[^/]+/key$ {
                auth_request /_auth;
                proxy_pass https://origin;
                proxy_cache off;
                add_header Cache-Control "no-store" always;
            }

            # Manifests carry a per-request signature in their body, so they are
            # cached per full URI and only briefly.
            location ~ \.(m3u8|mpd)$ {
                auth_request /_auth;
                proxy_pass         https://origin;
                proxy_cache        manifest;
                proxy_cache_key    "$uri$is_args$args";
                proxy_cache_valid  200 2s;
                proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
                proxy_cache_background_update on;
                add_header X-Cache-Status $upstream_cache_status always;
            }

            # Media. Content-addressed and immutable, so the signature is deliberately
            # NOT part of the cache key -- otherwise every viewer would get their own
            # copy and the hit rate would collapse to zero. Authorization already
            # happened in auth_request above.
            slice 1m;
            proxy_pass          https://origin;
            proxy_cache         media;
            proxy_cache_key     "$uri$slice_range";
            proxy_set_header    Range $slice_range;
            proxy_http_version  1.1;
            proxy_set_header    Connection "";
            proxy_cache_valid   200 206 30d;
            proxy_cache_valid   404 1m;

            # One request fills a slice; the rest wait rather than all stampeding
            # the origin. This is what keeps a viral lecture from melting Singapore.
            proxy_cache_lock          on;
            proxy_cache_lock_age      20s;
            proxy_cache_lock_timeout  20s;

            # Serve stale rather than fail when the origin is unreachable -- during a
            # submarine cable cut this is the difference between working and not.
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_background_update on;
            proxy_cache_revalidate on;

            add_header X-Cache-Status $upstream_cache_status always;
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Expose-Headers "Content-Length, Content-Range, ETag, Accept-Ranges" always;
        }

        location = /healthz { return 200 "ok\n"; }
    }
}
